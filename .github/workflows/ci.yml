# Fast Pipeline — runs on every PR and push to main.
# All checks are required gates before merge.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,redis,otel]"
          pip install pip-audit bandit mypy

      - name: Lint (ruff)
        run: ruff check runtime/ --output-format=github

      - name: Type check (mypy)
        run: mypy runtime/ --strict

      - name: Dependency audit (pip-audit)
        run: pip-audit --strict

      - name: AST security scan (bandit)
        run: bandit -r runtime/ -c .bandit.yaml -q

      - name: Unit tests + coverage
        run: |
          pytest tests/runtime/test_kitematic_runtime/ \
            --tb=line -q \
            --cov=runtime \
            --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Coverage gate (≥ 90%)
        run: |
          python scripts/check_coverage.py coverage.xml 90

      - name: Build check
        run: docker build -t kitematic-api . --quiet
