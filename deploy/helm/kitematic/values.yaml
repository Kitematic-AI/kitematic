replicaCount: 2

image:
  repository: kitematic-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

config:
  eventBackend: redis_streams
  redisUrl: redis://redis-service:6379/0
  logLevel: INFO
  quotaMaxConcurrent: 10
  quotaMaxPerMinute: 120
  otelServiceName: kitematic
  otelEndpoint: http://otel-collector-service:4317
