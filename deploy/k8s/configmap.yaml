apiVersion: v1
kind: ConfigMap
metadata:
  name: kitematic-config
  labels:
    app: kitematic
data:
  KITEMATIC_EVENT_BACKEND: "redis_streams"
  KITEMATIC_REDIS_URL: "redis://redis-service:6379/0"
  KITEMATIC_LOG_LEVEL: "INFO"
  KITEMATIC_QUOTA_MAX_CONCURRENT: "10"
  KITEMATIC_QUOTA_MAX_PER_MINUTE: "120"
  OTEL_SERVICE_NAME: "kitematic"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-service:4317"
