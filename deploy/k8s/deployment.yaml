apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitematic-api
  labels:
    app: kitematic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kitematic
  template:
    metadata:
      labels:
        app: kitematic
    spec:
      containers:
        - name: api
          image: kitematic-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kitematic-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
