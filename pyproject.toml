[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kitematic"
version = "1.0.0-rc.1"
description = "Kitematic Runtime — AI Operating System execution layer"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Kitematic Team"},
]

dependencies = [
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
redis = ["redis==8.0.1"]
otel = [
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.43.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "starlette==1.3.1",
    "mypy==2.3.0",
    "ruff==0.15.20",
    "pip-audit==2.11.2",
    "bandit==1.9.4",
]

[project.scripts]
kitematic-api = "runtime.kitematic_runtime.api.__main__:main"

[tool.setuptools.packages.find]
include = ["runtime*", "services*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "timeout(seconds): fail test if it takes longer than given seconds",
    "chaos: chaos engineering experiment marker",
    "chaos_nightly: lightweight chaos — runs nightly (4 AM UTC)",
    "chaos_weekly: medium chaos — runs weekly (Sunday 4 AM UTC)",
    "chaos_prerelease: full chaos — runs before release",
]

[tool.coverage.run]
source = ["runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "INP", "T10"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["redis", "opentelemetry.*"]
ignore_missing_imports = false
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["services.*"]
ignore_errors = true
